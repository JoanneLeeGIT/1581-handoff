<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>月報及票證上傳（原型）</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/huabus-theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="hb">
  <div id="toolbar"></div>
  <div class="app">
    <aside id="sidebar"></aside>
    <main id="main" class="hb-main">
      <section class="hb-card">
        <!-- 標題獨立一列，下方是分頁＋按鈕（業者也要上傳票證資料，所有角色都有分頁） -->
        <div class="hb-titlebar">
          <h1 class="hb-title">月報及票證資料上傳區</h1>
        </div>
        <div class="hb-tabbar" id="tabbar">
          <div class="hb-tabs" role="tablist">
            <button class="hb-tab active" role="tab" aria-selected="true" data-tab="monthly">營運月報</button>
            <button class="hb-tab" role="tab" aria-selected="false" data-tab="ticket">票證資料</button>
          </div>
          <div class="hb-actions" id="actions-tab"></div>
        </div>
        <div class="hb-box">
          <div id="tab-monthly">
            <div id="matrix"></div>
          </div>
          <div id="tab-ticket" hidden>
            <div id="ticket"></div>
          </div>
          <div class="hb-legend" id="legend"></div>
        </div>
      </section>
    </main>
  </div>
  <div id="hb-tip" class="hb-tip" role="tooltip" hidden></div>
  <div id="hb-hint" class="hb-hint" role="tooltip" hidden></div>
  <div id="modals"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initIndexPage } from './js/ui/pages.js';
    initIndexPage();
  </script>
</body>
</html>
